<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1040" height="700" fill="#f7f9fb"/>
  <text x="520" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Enlace de fibra de backbone, de rack a rack</text>
  <text x="520" y="52" text-anchor="middle" font-size="12" fill="#4a5560">Un sentido. El camino baja por el rack A, cruza el troncal y sube por el rack B.</text>

  <!-- Rack A -->
  <rect x="28" y="72" width="300" height="500" rx="10" fill="#e8f5ee" stroke="#2f7d4a" stroke-width="2"/>
  <text x="178" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Rack A</text>
  <text x="178" y="116" text-anchor="middle" font-size="11" fill="#4a5560">FD o BD</text>

  <rect x="64" y="128" width="228" height="40" rx="6" fill="#3b6ea5"/>
  <text x="178" y="153" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Switch · puerto óptico</text>

  <line x1="178" y1="168" x2="178" y2="186" stroke="#1a2332" stroke-width="2"/>
  <polygon points="172,186 178,198 184,186" fill="#1a2332"/>

  <rect x="64" y="202" width="228" height="32" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="178" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Conector · 0,5 dB</text>

  <text x="178" y="254" text-anchor="middle" font-size="12" fill="#4a5560">Latiguillo de fibra</text>
  <line x1="178" y1="262" x2="178" y2="276" stroke="#1a2332" stroke-width="2"/>
  <polygon points="172,276 178,288 184,276" fill="#1a2332"/>

  <rect x="64" y="292" width="228" height="32" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="178" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Conector del ODF · 0,5 dB</text>

  <rect x="64" y="336" width="228" height="48" rx="6" fill="#2f7d4a"/>
  <text x="178" y="356" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ODF / bandeja</text>
  <text x="178" y="374" text-anchor="middle" fill="#e8f5ee" font-size="11">de empalmes</text>

  <text x="178" y="406" text-anchor="middle" font-size="12" fill="#4a5560">Pigtail</text>
  <line x1="178" y1="412" x2="178" y2="422" stroke="#1a2332" stroke-width="2"/>
  <polygon points="172,422 178,434 184,422" fill="#1a2332"/>

  <rect x="64" y="438" width="228" height="32" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="178" y="459" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Fusión del pigtail · 0,1 dB</text>

  <rect x="64" y="482" width="228" height="32" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="178" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Fusión de la caja · 0,1 dB</text>

  <line x1="178" y1="514" x2="178" y2="572" stroke="#6b4ea1" stroke-width="4"/>

  <!-- Trunk -->
  <line x1="178" y1="572" x2="862" y2="572" stroke="#6b4ea1" stroke-width="4"/>
  <polygon points="850,566 862,572 850,578" fill="#6b4ea1"/>
  <rect x="360" y="544" width="320" height="28" rx="6" fill="#f3e8f6" stroke="#6b4ea1"/>
  <text x="520" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Cable troncal · 8 km · 2,8 dB</text>

  <!-- Rack B: la señal entra por abajo y sube hasta el switch -->
  <rect x="712" y="72" width="300" height="500" rx="10" fill="#e8f1fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="862" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Rack B</text>
  <text x="862" y="116" text-anchor="middle" font-size="11" fill="#4a5560">BD o CD</text>

  <rect x="748" y="128" width="228" height="36" rx="6" fill="#3b6ea5"/>
  <text x="862" y="151" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Switch · puerto óptico</text>

  <polygon points="856,176 862,164 868,176" fill="#1a2332"/>
  <line x1="862" y1="176" x2="862" y2="188" stroke="#1a2332" stroke-width="2"/>

  <rect x="748" y="188" width="228" height="30" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="862" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Conector · 0,5 dB</text>

  <text x="862" y="238" text-anchor="middle" font-size="12" fill="#4a5560">Latiguillo de fibra</text>

  <polygon points="856,266 862,254 868,266" fill="#1a2332"/>
  <line x1="862" y1="266" x2="862" y2="278" stroke="#1a2332" stroke-width="2"/>

  <rect x="748" y="278" width="228" height="30" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="862" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Conector del ODF · 0,5 dB</text>

  <rect x="748" y="320" width="228" height="46" rx="6" fill="#2f7d4a"/>
  <text x="862" y="340" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ODF / bandeja</text>
  <text x="862" y="356" text-anchor="middle" fill="#e8f5ee" font-size="11">de empalmes</text>

  <text x="862" y="388" text-anchor="middle" font-size="12" fill="#4a5560">Pigtail</text>

  <polygon points="856,418 862,406 868,418" fill="#1a2332"/>
  <line x1="862" y1="418" x2="862" y2="430" stroke="#1a2332" stroke-width="2"/>

  <rect x="748" y="430" width="228" height="30" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="862" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Fusión del pigtail · 0,1 dB</text>

  <rect x="748" y="470" width="228" height="30" rx="6" fill="#fff3d6" stroke="#d68910" stroke-width="1.5"/>
  <text x="862" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Fusión de la caja · 0,1 dB</text>

  <line x1="862" y1="500" x2="862" y2="572" stroke="#6b4ea1" stroke-width="4"/>

  <text x="520" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">4 conectores × 0,5 dB + 4 fusiones × 0,1 dB + fibra 2,8 dB = 5,2 dB</text>
  <text x="520" y="654" text-anchor="middle" font-size="12" fill="#4a5560">Máximo orientativo de este enlace (10 Gbit/s, monomodo, unos 10 km): 6,0 dB. Margen: 0,8 dB.</text>
  <text x="520" y="678" text-anchor="middle" font-size="12" fill="#4a5560">Las casillas en ámbar son pérdidas. El cable del troncal aporta los 2,8 dB de los 8 km.</text>
</svg>
