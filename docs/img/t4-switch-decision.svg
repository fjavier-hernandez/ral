<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="900" height="560" fill="#f7f9fb"/>
<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Qué hace un switch con cada trama que recibe</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Primero aprende de la MAC origen; después decide con la MAC destino.</text>
<rect x="190" y="66" width="280" height="40" rx="4" fill="#3b6ea5"/>
<text x="330.0" y="90.55" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">Llega una trama por el puerto X</text>
<line x1="330" y1="106" x2="330" y2="124" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<rect x="160" y="126" width="340" height="48" rx="4" fill="#2f7d4a"/>
<text x="330.0" y="146.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">APRENDE: anota «MAC origen = puerto X»</text>
<text x="330.0" y="162.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">(o refresca su temporizador)</text>
<line x1="330" y1="174" x2="330" y2="196" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="330,198.0 455.0,238 330,278.0 205.0,238" fill="#fdf1d8" stroke="#1a2332" stroke-width="1.5"/>
<text x="330" y="234.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">¿Destino broadcast</text>
<text x="330" y="250.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">o multicast?</text>
<line x1="455" y1="238" x2="620" y2="238" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="480" y="230" text-anchor="start" font-size="12" fill="#c0392b" font-weight="700">Sí</text>
<rect x="622" y="214" width="240" height="48" rx="4" fill="#f5a623"/>
<text x="742.0" y="234.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">INUNDA: copia por todos</text>
<text x="742.0" y="250.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">los puertos menos el X</text>
<line x1="330" y1="278" x2="330" y2="304" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="340" y="296" text-anchor="start" font-size="12" fill="#2f7d4a" font-weight="700">No</text>
<polygon points="330,306.0 455.0,346 330,386.0 205.0,346" fill="#fdf1d8" stroke="#1a2332" stroke-width="1.5"/>
<text x="330" y="342.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">¿MAC destino está</text>
<text x="330" y="358.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">en la tabla?</text>
<line x1="455" y1="346" x2="620" y2="346" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="480" y="338" text-anchor="start" font-size="12" fill="#c0392b" font-weight="700">No</text>
<rect x="622" y="322" width="240" height="48" rx="4" fill="#f5a623"/>
<text x="742.0" y="342.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">INUNDA (destino</text>
<text x="742.0" y="358.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">desconocido)</text>
<line x1="330" y1="386" x2="330" y2="412" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="340" y="404" text-anchor="start" font-size="12" fill="#2f7d4a" font-weight="700">Sí</text>
<polygon points="330,414.0 455.0,454 330,494.0 205.0,454" fill="#fdf1d8" stroke="#1a2332" stroke-width="1.5"/>
<text x="330" y="450.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">¿Está en el mismo</text>
<text x="330" y="466.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">puerto X?</text>
<line x1="205" y1="454" x2="130" y2="454" stroke="#4a5560" stroke-width="2"/>
<line x1="130" y1="454" x2="130" y2="500" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="140" y="446" text-anchor="start" font-size="12" fill="#4a5560" font-weight="700">Sí</text>
<rect x="30" y="502" width="200" height="44" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="130.0" y="528.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">FILTRA: la descarta</text>
<line x1="455" y1="454" x2="620" y2="454" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<text x="480" y="446" text-anchor="start" font-size="12" fill="#2f7d4a" font-weight="700">No</text>
<rect x="622" y="430" width="240" height="48" rx="4" fill="#2f7d4a"/>
<text x="742.0" y="450.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">REENVÍA solo por el</text>
<text x="742.0" y="466.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">puerto de destino</text>
<text x="742" y="520" text-anchor="middle" font-size="12" fill="#4a5560" font-style="italic">Las entradas sin tráfico caducan</text>
<text x="742" y="538" text-anchor="middle" font-size="12" fill="#4a5560" font-style="italic">(300 s por defecto en Cisco)</text>
</svg>
