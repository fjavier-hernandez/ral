<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="900" height="330" fill="#f7f9fb"/>
<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Métodos de conmutación: cuánto lee el switch antes de reenviar</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Cuanto más espera, más comprueba; cuanto menos espera, menos retardo añade.</text>
<rect x="60" y="80" width="68.0" height="44" rx="1" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="94.0" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">Sincronía</text>
<rect x="128.0" y="80" width="51.0" height="44" rx="1" fill="#f5a623" stroke="#4a5560" stroke-width="1.5"/>
<text x="153.5" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">Destino</text>
<rect x="179.0" y="80" width="51.0" height="44" rx="1" fill="#f5a623" stroke="#4a5560" stroke-width="1.5"/>
<text x="204.5" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">Origen</text>
<rect x="230.0" y="80" width="17.0" height="44" rx="1" fill="#ebe5f5" stroke="#4a5560" stroke-width="1.5"/>
<text x="238.5" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">T</text>
<rect x="247.0" y="80" width="595.0" height="44" rx="1" fill="#dce8f5" stroke="#4a5560" stroke-width="1.5"/>
<text x="544.5" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">Datos…</text>
<rect x="842.0" y="80" width="34.0" height="44" rx="1" fill="#e3f1e8" stroke="#4a5560" stroke-width="1.5"/>
<text x="859.0" y="107" text-anchor="middle" font-size="10" fill="#1a2332" font-weight="700">FCS</text>
<line x1="179.0" y1="72" x2="179.0" y2="136" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="185.0" y="150" text-anchor="start" font-size="13" fill="#c0392b" font-weight="700">Corte (cut-through)</text>
<text x="185.0" y="168" text-anchor="start" font-size="11" fill="#4a5560">Reenvía nada más leer la MAC destino. Mínimo retardo; puede propagar tramas erróneas.</text>
<line x1="604.0" y1="72" x2="604.0" y2="191" stroke="#6b4ea1" stroke-width="2" stroke-dasharray="5 3"/>
<text x="598.0" y="205" text-anchor="end" font-size="13" fill="#6b4ea1" font-weight="700">Libre de fragmentos</text>
<text x="598.0" y="223" text-anchor="end" font-size="11" fill="#4a5560">Espera a los primeros 64 bytes: así descarta los restos de colisión.</text>
<line x1="876.0" y1="72" x2="876.0" y2="246" stroke="#2f7d4a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="870.0" y="260" text-anchor="end" font-size="13" fill="#2f7d4a" font-weight="700">Almacenamiento y reenvío</text>
<text x="870.0" y="278" text-anchor="end" font-size="11" fill="#4a5560">Recibe la trama entera y comprueba el FCS. Lo habitual en switches actuales.</text>
</svg>
