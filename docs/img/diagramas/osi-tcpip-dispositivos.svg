<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="480" fill="#f7f9fb"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">OSI (7 capas) frente a TCP/IP (4 capas)</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#5a6570">Dispositivos y ejemplos habituales en una LAN</text>

  <text x="160" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">OSI</text>
  <text x="460" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">TCP/IP</text>
  <text x="740" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Dispositivos / ejemplos</text>

  <rect x="40" y="96" width="240" height="42" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="160" y="122" text-anchor="middle" font-size="13" fill="#1a2332">7 Aplicación</text>
  <rect x="300" y="96" width="320" height="134" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="460" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">Aplicación</text>
  <text x="460" y="180" text-anchor="middle" font-size="11" fill="#5a6570">HTTP, DNS, SMTP, DHCP…</text>
  <rect x="640" y="96" width="240" height="134" rx="4" fill="#fff" stroke="#3b6ea5"/>
  <text x="760" y="150" text-anchor="middle" font-size="12" fill="#1a2332">PC, servidor, navegador</text>
  <text x="760" y="170" text-anchor="middle" font-size="11" fill="#5a6570">firewall de aplicación</text>

  <rect x="40" y="142" width="240" height="42" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="160" y="168" text-anchor="middle" font-size="13" fill="#1a2332">6 Presentación</text>

  <rect x="40" y="188" width="240" height="42" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="160" y="214" text-anchor="middle" font-size="13" fill="#1a2332">5 Sesión</text>

  <rect x="40" y="238" width="240" height="48" rx="4" fill="#eaf6ef" stroke="#2f7d4a"/>
  <text x="160" y="267" text-anchor="middle" font-size="13" fill="#1a2332">4 Transporte</text>
  <rect x="300" y="238" width="320" height="48" rx="4" fill="#eaf6ef" stroke="#2f7d4a"/>
  <text x="460" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">Transporte (TCP / UDP)</text>
  <rect x="640" y="238" width="240" height="48" rx="4" fill="#fff" stroke="#2f7d4a"/>
  <text x="760" y="267" text-anchor="middle" font-size="12" fill="#1a2332">Firewall, balanceador L4</text>

  <rect x="40" y="294" width="240" height="48" rx="4" fill="#fef6e8" stroke="#b7791f"/>
  <text x="160" y="323" text-anchor="middle" font-size="13" fill="#1a2332">3 Red</text>
  <rect x="300" y="294" width="320" height="48" rx="4" fill="#fef6e8" stroke="#b7791f"/>
  <text x="460" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">Internet (IP, ICMP…)</text>
  <rect x="640" y="294" width="240" height="48" rx="4" fill="#fff" stroke="#b7791f"/>
  <text x="760" y="323" text-anchor="middle" font-size="12" fill="#1a2332">Router, L3 switch</text>

  <rect x="40" y="350" width="240" height="48" rx="4" fill="#f3eef8" stroke="#6b4ea1"/>
  <text x="160" y="379" text-anchor="middle" font-size="13" fill="#1a2332">2 Enlace de datos</text>
  <rect x="300" y="350" width="320" height="96" rx="4" fill="#eef0f2" stroke="#4a5560"/>
  <text x="460" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">Acceso a la red</text>
  <text x="460" y="410" text-anchor="middle" font-size="11" fill="#5a6570">Ethernet, Wi-Fi (enlace + física)</text>
  <rect x="640" y="350" width="240" height="48" rx="4" fill="#fff" stroke="#6b4ea1"/>
  <text x="760" y="379" text-anchor="middle" font-size="12" fill="#1a2332">Switch, AP, NIC (MAC)</text>

  <rect x="40" y="402" width="240" height="44" rx="4" fill="#eef0f2" stroke="#4a5560"/>
  <text x="160" y="429" text-anchor="middle" font-size="13" fill="#1a2332">1 Física</text>
  <rect x="640" y="402" width="240" height="44" rx="4" fill="#fff" stroke="#4a5560"/>
  <text x="760" y="429" text-anchor="middle" font-size="12" fill="#1a2332">Hub, repetidor, cable</text>

  <text x="460" y="468" text-anchor="middle" font-size="11" fill="#5a6570">ARP se estudia con la capa de red en el Tema 5; en OSI se relaciona a menudo con el enlace.</text>
</svg>
