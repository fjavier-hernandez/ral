<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">STP: tres switches en triángulo y un puerto bloqueado</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">El cable redundante sigue conectado, pero STP lo deja en espera para que no haya bucle.</text>
