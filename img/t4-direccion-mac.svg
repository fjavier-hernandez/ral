<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="900" height="430" fill="#f7f9fb"/>
<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Estructura de una dirección MAC (48 bits)</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Se escribe en 12 dígitos hexadecimales: 00:00:0C:12:34:56, 00-00-0C-12-34-56 o 0000.0c12.3456 (Cisco).</text>
<rect x="150" y="80" width="94" height="50" rx="4" fill="#f5a623"/>
<text x="197.0" y="112.0" text-anchor="middle" font-size="20" fill="#1a2332" font-weight="700">00</text>
<rect x="250" y="80" width="94" height="50" rx="4" fill="#f5a623"/>
<text x="297.0" y="112.0" text-anchor="middle" font-size="20" fill="#1a2332" font-weight="700">00</text>
<rect x="350" y="80" width="94" height="50" rx="4" fill="#f5a623"/>
<text x="397.0" y="112.0" text-anchor="middle" font-size="20" fill="#1a2332" font-weight="700">0C</text>
<rect x="450" y="80" width="94" height="50" rx="4" fill="#3b6ea5"/>
<text x="497.0" y="112.0" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">12</text>
<rect x="550" y="80" width="94" height="50" rx="4" fill="#3b6ea5"/>
<text x="597.0" y="112.0" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">34</text>
<rect x="650" y="80" width="94" height="50" rx="4" fill="#3b6ea5"/>
<text x="697.0" y="112.0" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">56</text>
<rect x="150" y="140" width="294" height="30" rx="4" fill="#fdf1d8" stroke="#d68910" stroke-width="1.5"/>
<text x="297" y="160" text-anchor="middle" font-size="13" fill="#1a2332" font-weight="700">OUI: fabricante (24 bits)</text>
<rect x="450" y="140" width="294" height="30" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="597" y="160" text-anchor="middle" font-size="13" fill="#1a2332" font-weight="700">Identificador de la tarjeta (24 bits)</text>
<text x="450" y="192" text-anchor="middle" font-size="12" fill="#4a5560">00:00:0C es un OUI de Cisco; los tres últimos octetos los asigna el fabricante a cada interfaz.</text>
<text x="450" y="232" text-anchor="middle" font-size="13" fill="#1a2332" font-weight="700">Los dos bits menos significativos del primer octeto tienen significado propio</text>
<rect x="250" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="273.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b7</text>
<rect x="300" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="323.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b6</text>
<rect x="350" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="373.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b5</text>
<rect x="400" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="423.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b4</text>
<rect x="450" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="473.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b3</text>
<rect x="500" y="248" width="46" height="40" rx="4" fill="#e6e9ed"/>
<text x="523.0" y="272.2" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">b2</text>
<rect x="550" y="248" width="46" height="40" rx="4" fill="#6b4ea1"/>
<text x="573.0" y="272.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">U/L</text>
<rect x="600" y="248" width="46" height="40" rx="4" fill="#c0392b"/>
<text x="623.0" y="272.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">I/G</text>
<text x="450" y="306" text-anchor="middle" font-size="11" fill="#4a5560" font-style="italic">Primer octeto</text>
<rect x="60" y="322" width="380" height="92" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="250" y="344" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="700">I/G (individual / grupo)</text>
<text x="250" y="366" text-anchor="middle" font-size="12" fill="#1a2332">0: unicast: un único destino</text>
<text x="250" y="386" text-anchor="middle" font-size="12" fill="#1a2332">1: multicast: un grupo (p. ej. 01:00:5E:…)</text>
<text x="250" y="406" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">FF:FF:FF:FF:FF:FF: broadcast: todos</text>
<rect x="460" y="322" width="380" height="92" rx="4" fill="#fff" stroke="#6b4ea1" stroke-width="1.5"/>
<text x="650" y="344" text-anchor="middle" font-size="13" fill="#6b4ea1" font-weight="700">U/L (universal / local)</text>
<text x="650" y="366" text-anchor="middle" font-size="12" fill="#1a2332">0: grabada por el fabricante (única)</text>
<text x="650" y="386" text-anchor="middle" font-size="12" fill="#1a2332">1: asignada en local (MAC aleatoria del móvil,</text>
<text x="650" y="404" text-anchor="middle" font-size="12" fill="#1a2332">máquinas virtuales…): segundo dígito 2, 6, A o E</text>
</svg>
