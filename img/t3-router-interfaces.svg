<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#f7f9fb"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Router: redes distintas e interfaces</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#4a5560">El switch une equipos de la misma LAN. El router une redes distintas y es la puerta de enlace del PC.</text>

  <!-- LAN cloud -->
  <rect x="30" y="80" width="250" height="230" rx="10" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="155" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">LAN del aula (capa 2)</text>
  <rect x="70" y="130" width="60" height="32" rx="4" fill="#3b6ea5"/>
  <text x="100" y="151" text-anchor="middle" fill="#fff" font-size="12">PC</text>
  <rect x="170" y="130" width="70" height="32" rx="4" fill="#2f7d4a"/>
  <text x="205" y="151" text-anchor="middle" fill="#fff" font-size="12">Switch</text>
  <line x1="130" y1="146" x2="170" y2="146" stroke="#4a5560" stroke-width="2"/>
  <text x="155" y="200" text-anchor="middle" font-size="12" fill="#1a2332">192.168.10.0/24</text>
  <text x="155" y="222" text-anchor="middle" font-size="11" fill="#4a5560">Puerta de enlace del PC:</text>
  <text x="155" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2332">192.168.10.1</text>
  <text x="155" y="280" text-anchor="middle" font-size="11" fill="#4a5560">(ejemplo de laboratorio, no del centro)</text>

  <!-- Router -->
  <rect x="340" y="140" width="220" height="140" rx="8" fill="#8b3a3a" stroke="#1a2332"/>
  <text x="450" y="170" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">ROUTER / GATEWAY</text>
  <text x="450" y="192" text-anchor="middle" fill="#f4e8e8" font-size="11">Capa 3 · tabla de rutas</text>
  <text x="450" y="220" text-anchor="middle" fill="#fff" font-size="12">LAN  Gi0/0  192.168.10.1</text>
  <text x="450" y="242" text-anchor="middle" fill="#fff" font-size="12">WAN  Gi0/1  hacia el ISP</text>
  <text x="450" y="264" text-anchor="middle" fill="#f4e8e8" font-size="11">Consola: configuración local</text>

  <!-- WAN -->
  <rect x="620" y="80" width="250" height="230" rx="10" fill="#f3e8f6" stroke="#6b4ea1"/>
  <text x="745" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">WAN / proveedor</text>
  <rect x="680" y="150" width="130" height="50" rx="6" fill="#6b4ea1"/>
  <text x="745" y="180" text-anchor="middle" fill="#fff" font-size="13">Internet (ISP)</text>
  <text x="745" y="230" text-anchor="middle" font-size="12" fill="#1a2332">NAT y, a menudo, DHCP</text>
  <text x="745" y="252" text-anchor="middle" font-size="11" fill="#4a5560">en el borde del edificio</text>

  <line x1="280" y1="210" x2="340" y2="210" stroke="#1a2332" stroke-width="3"/>
  <line x1="560" y1="210" x2="620" y2="210" stroke="#1a2332" stroke-width="3"/>

  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#4a5560">Aula  switch  router/cortafuegos  proveedor. El cortafuegos filtra; el router encamina.</text>
</svg>
