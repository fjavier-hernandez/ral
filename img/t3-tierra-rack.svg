<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="340" fill="#f7f9fb"/>
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Tierra de telecomunicaciones (TIA-607)</text>

  <rect x="40" y="60" width="280" height="220" rx="8" fill="#e8f5ee" stroke="#2f7d4a"/>
  <text x="180" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Rack (FD o BD)</text>
  <rect x="70" y="110" width="220" height="36" rx="4" fill="#2f7d4a"/>
  <text x="180" y="133" text-anchor="middle" fill="#fff" font-size="12">Switch / panel</text>
  <rect x="70" y="170" width="220" height="44" rx="4" fill="#2f7d4a"/>
  <text x="180" y="190" text-anchor="middle" fill="#fff" font-size="12">Barra de tierra del rack</text>
  <text x="180" y="208" text-anchor="middle" fill="#e8f5ee" font-size="10">verde / verde-amarillo</text>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="#4a5560">Chasis atornillado a la barra</text>

  <rect x="460" y="60" width="280" height="220" rx="8" fill="#fff3d6" stroke="#d68910"/>
  <text x="600" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Sala / edificio</text>
  <rect x="490" y="120" width="220" height="40" rx="4" fill="#d68910"/>
  <text x="600" y="145" text-anchor="middle" fill="#1a2332" font-size="12" font-weight="600">Barra de sala (TGB)</text>
  <rect x="490" y="190" width="220" height="40" rx="4" fill="#8b5a00"/>
  <text x="600" y="215" text-anchor="middle" fill="#fff" font-size="12">Barra principal (TMGB)</text>

  <line x1="320" y1="192" x2="490" y2="140" stroke="#2f7d4a" stroke-width="3"/>
  <line x1="600" y1="160" x2="600" y2="190" stroke="#8b5a00" stroke-width="3"/>

  <text x="390" y="320" text-anchor="middle" font-size="12" fill="#4a5560">Protege a las personas, descarga el armario y reduce ruido eléctrico. No se usa el UTP de datos como tierra.</text>
</svg>
