  <rect x="540" y="70" width="70" height="36" rx="4" fill="#3b6ea5"/>
  <text x="575" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">PC3</text>
  <rect x="750" y="70" width="70" height="36" rx="4" fill="#3b6ea5"/>
  <text x="785" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">PC4</text>

  <text x="75" y="124" text-anchor="middle" font-size="10" fill="#4a5560">00:11:22:AA:00:01</text>
  <text x="275" y="124" text-anchor="middle" font-size="10" fill="#4a5560">00:11:22:AA:00:02</text>
  <text x="575" y="124" text-anchor="middle" font-size="10" fill="#4a5560">00:11:22:AA:00:03</text>
  <text x="785" y="124" text-anchor="middle" font-size="10" fill="#4a5560">00:11:22:AA:00:04</text>

