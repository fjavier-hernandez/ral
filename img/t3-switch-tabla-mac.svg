  <line x1="275" y1="128" x2="360" y2="200" stroke="#4a5560" stroke-width="2"/>
  <line x1="575" y1="128" x2="500" y2="200" stroke="#4a5560" stroke-width="2"/>
  <line x1="785" y1="128" x2="560" y2="200" stroke="#4a5560" stroke-width="2"/>

  <rect x="250" y="200" width="360" height="56" rx="6" fill="#2f7d4a" stroke="#1a2332"/>
