  <text x="470" y="338" font-size="12" font-weight="600" fill="#1a2332">Dirección MAC</text>
  <text x="270" y="364" font-size="12" fill="#1a2332">Fa0/1</text>
  <text x="430" y="364" font-size="12" fill="#1a2332">00:11:22:AA:00:01</text>
  <text x="270" y="388" font-size="12" fill="#1a2332">Fa0/2</text>
