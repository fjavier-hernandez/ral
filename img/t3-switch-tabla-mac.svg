<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="480" fill="#f7f9fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Switch: aprendizaje de MAC y reenvío por puerto</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Cuatro PC en el mismo switch. La tabla MAC asocia cada puerto a la MAC que ha visto en él.</text>

  <rect x="40" y="70" width="70" height="36" rx="4" fill="#3b6ea5"/>
