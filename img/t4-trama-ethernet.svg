<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="980" height="380" fill="#f7f9fb"/>
<text x="490.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Trama Ethernet II / IEEE 802.3</text>
<text x="490.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Tamaños en bytes. La trama propiamente dicha va de la MAC destino al FCS: entre 64 y 1518 bytes.</text>
<rect x="40" y="90" width="90" height="70" rx="2" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="85.0" y="129" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Preámbulo</text>
<text x="85.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">7</text>
<rect x="130" y="90" width="50" height="70" rx="2" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="155.0" y="129" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">SFD</text>
<text x="155.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">1</text>
<rect x="180" y="90" width="90" height="70" rx="2" fill="#f5a623" stroke="#4a5560" stroke-width="1.5"/>
<text x="225.0" y="121" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">MAC</text>
<text x="225.0" y="137" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">destino</text>
<text x="225.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">6</text>
<rect x="270" y="90" width="90" height="70" rx="2" fill="#f5a623" stroke="#4a5560" stroke-width="1.5"/>
<text x="315.0" y="121" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">MAC</text>
<text x="315.0" y="137" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">origen</text>
<text x="315.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">6</text>
<rect x="360" y="90" width="90" height="70" rx="2" fill="#fff" stroke="#4a5560" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="405.0" y="121" text-anchor="middle" font-size="12" fill="#4a5560" font-weight="700">802.1Q</text>
<text x="405.0" y="137" text-anchor="middle" font-size="12" fill="#4a5560" font-weight="700">(opcional)</text>
<text x="405.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">4</text>
<rect x="450" y="90" width="80" height="70" rx="2" fill="#ebe5f5" stroke="#4a5560" stroke-width="1.5"/>
<text x="490.0" y="121" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Tipo /</text>
<text x="490.0" y="137" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">longitud</text>
<text x="490.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">2</text>
<rect x="530" y="90" width="250" height="70" rx="2" fill="#dce8f5" stroke="#4a5560" stroke-width="1.5"/>
<text x="655.0" y="129" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Datos + relleno</text>
<text x="655.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">46 – 1500</text>
<rect x="780" y="90" width="80" height="70" rx="2" fill="#e3f1e8" stroke="#4a5560" stroke-width="1.5"/>
<text x="820.0" y="121" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">FCS</text>
<text x="820.0" y="137" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">(CRC-32)</text>
<text x="820.0" y="182" text-anchor="middle" font-size="12" fill="#4a5560">4</text>
<text x="900" y="125" text-anchor="middle" font-size="12" fill="#4a5560" font-weight="700">IFG</text>
<text x="900" y="182" text-anchor="middle" font-size="12" fill="#4a5560">12</text>
<rect x="865" y="90" width="70" height="70" rx="2" fill="none" stroke="#4a5560" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="180" y1="205" x2="860" y2="205" stroke="#1a2332" stroke-width="2"/>
<line x1="180" y1="198" x2="180" y2="212" stroke="#1a2332" stroke-width="2"/>
<line x1="860" y1="198" x2="860" y2="212" stroke="#1a2332" stroke-width="2"/>
<text x="520.0" y="225" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Trama: mínimo 64 bytes · máximo 1518 (1522 con etiqueta 802.1Q)</text>
<line x1="40" y1="205" x2="180" y2="205" stroke="#4a5560" stroke-width="2"/>
<text x="110.0" y="225" text-anchor="middle" font-size="12" fill="#4a5560">Sincronía</text>
<text x="40" y="262" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">Preámbulo + SFD:</text>
<text x="165" y="262" text-anchor="start" font-size="12" fill="#4a5560">10101010 x 7 y 10101011: el receptor sincroniza su reloj y sabe dónde empieza la trama.</text>
<text x="40" y="281" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">Direcciones MAC:</text>
<text x="165" y="281" text-anchor="start" font-size="12" fill="#4a5560">48 bits cada una. Primero va el destino para que el switch pueda decidir cuanto antes.</text>
<text x="40" y="300" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">Tipo / longitud:</text>
<text x="165" y="300" text-anchor="start" font-size="12" fill="#4a5560">0x0600 (1536) o más indica el protocolo de arriba: 0x0800 IPv4 · 0x0806 ARP · 0x86DD IPv6.</text>
<text x="40" y="319" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">Datos + relleno:</text>
<text x="165" y="319" text-anchor="start" font-size="12" fill="#4a5560">Si los datos no llegan a 46 bytes, se rellenan hasta 46 para alcanzar los 64 de la trama mínima.</text>
<text x="40" y="338" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">FCS:</text>
<text x="165" y="338" text-anchor="start" font-size="12" fill="#4a5560">Valor CRC-32 calculado por el emisor. Si no cuadra en el receptor, la trama se descarta.</text>
<text x="40" y="357" text-anchor="start" font-size="12" fill="#1a2332" font-weight="700">IFG:</text>
<text x="165" y="357" text-anchor="start" font-size="12" fill="#4a5560">Silencio de 96 bits entre tramas; no es parte de la trama, pero ocupa el medio.</text>
</svg>
