  <text x="401" y="132" text-anchor="middle" fill="#e8f1fb" font-size="11">cleaver</text>

  <polygon points="474,115 490,123 474,131" fill="#4a5560"/>

  <rect x="496" y="70" width="130" height="90" rx="8" fill="#2f7d4a"/>
