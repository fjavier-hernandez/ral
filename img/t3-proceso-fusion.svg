  <text x="241" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2. Limpieza</text>
  <text x="241" y="132" text-anchor="middle" fill="#e8f1fb" font-size="11">alcohol isopropílico</text>

  <polygon points="314,115 330,123 314,131" fill="#4a5560"/>

  <rect x="336" y="70" width="130" height="90" rx="8" fill="#3b6ea5"/>
