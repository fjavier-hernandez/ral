<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="420" fill="#f7f9fb"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Instalación completa: del puesto al campus</text>

  <!-- Work area -->
  <rect x="16" y="50" width="200" height="300" rx="8" fill="#e8f1fb" stroke="#3b6ea5"/>
  <text x="116" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Área de trabajo</text>
  <rect x="56" y="100" width="120" height="40" rx="4" fill="#3b6ea5"/>
  <text x="116" y="125" text-anchor="middle" fill="#fff" font-size="13">Puesto (PC)</text>
  <line x1="116" y1="140" x2="116" y2="180" stroke="#1a2332" stroke-width="2"/>
  <text x="150" y="168" font-size="10" fill="#4a5560">d 5 m</text>
  <rect x="56" y="180" width="120" height="40" rx="4" fill="#2f7d4a"/>
  <text x="116" y="205" text-anchor="middle" fill="#fff" font-size="13">TO (roseta)</text>
  <text x="116" y="250" text-anchor="middle" font-size="11" fill="#4a5560">Latiguillo del puesto</text>

  <!-- Horizontal -->
  <rect x="230" y="160" width="160" height="80" rx="8" fill="#fff3d6" stroke="#d68910"/>
  <text x="310" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Horizontal</text>
  <text x="310" y="214" text-anchor="middle" font-size="12" fill="#4a5560">90 m permanentes</text>
  <text x="310" y="232" text-anchor="middle" font-size="11" fill="#4a5560">canaleta / bandeja</text>

  <!-- FD rack -->
  <rect x="410" y="50" width="280" height="300" rx="8" fill="#e8f5ee" stroke="#2f7d4a"/>
  <text x="550" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Rack del FD (planta)</text>
  <rect x="450" y="100" width="200" height="40" rx="4" fill="#2f7d4a"/>
  <text x="550" y="125" text-anchor="middle" fill="#fff" font-size="13">Panel de parcheo</text>
  <line x1="550" y1="140" x2="550" y2="170" stroke="#1a2332" stroke-width="2"/>
  <text x="640" y="160" font-size="10" fill="#4a5560">latiguillo</text>
  <rect x="450" y="170" width="200" height="40" rx="4" fill="#2f7d4a"/>
  <text x="550" y="195" text-anchor="middle" fill="#fff" font-size="13">Switch</text>
  <line x1="550" y1="210" x2="550" y2="240" stroke="#1a2332" stroke-width="2"/>
  <rect x="450" y="240" width="200" height="40" rx="4" fill="#8b3a3a"/>
  <text x="550" y="265" text-anchor="middle" fill="#fff" font-size="13">Router / gateway</text>
  <text x="550" y="318" text-anchor="middle" font-size="11" fill="#4a5560">Electrónica atornillada a 193</text>

  <!-- Backbone -->
  <rect x="710" y="50" width="250" height="300" rx="8" fill="#f3e8f6" stroke="#6b4ea1"/>
  <text x="835" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Hacia el edificio / campus</text>
  <rect x="750" y="120" width="170" height="50" rx="4" fill="#6b4ea1"/>
  <text x="835" y="150" text-anchor="middle" fill="#fff" font-size="13">BD (edificio)</text>
  <line x1="835" y1="170" x2="835" y2="210" stroke="#1a2332" stroke-width="2"/>
  <rect x="750" y="210" width="170" height="50" rx="4" fill="#6b4ea1"/>
  <text x="835" y="240" text-anchor="middle" fill="#fff" font-size="13">CD (campus)</text>
  <text x="835" y="300" text-anchor="middle" font-size="11" fill="#4a5560">Backbone: cobre o fibra</text>

  <line x1="216" y1="200" x2="230" y2="200" stroke="#1a2332" stroke-width="3"/>
  <line x1="390" y1="200" x2="410" y2="200" stroke="#1a2332" stroke-width="3"/>
  <line x1="690" y1="260" x2="710" y2="260" stroke="#1a2332" stroke-width="3"/>

  <text x="490" y="400" text-anchor="middle" font-size="12" fill="#4a5560">El tendido pasivo (TO, horizontal, panel) permanece cuando se cambia el switch o el router.</text>
</svg>
