<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="900" height="330" fill="#f7f9fb"/>
<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">La trama solo viaja entre vecinos: se rehace en cada salto</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">El paquete IP va de extremo a extremo; la trama de capa 2 cambia en cada enlace.</text>
<rect x="40" y="110" width="150" height="46" rx="4" fill="#3b6ea5"/>
<text x="115.0" y="137.9" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">PC A</text>
<rect x="260" y="110" width="150" height="46" rx="4" fill="#2f7d4a"/>
<text x="335.0" y="137.9" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Switch</text>
<rect x="480" y="110" width="150" height="46" rx="4" fill="#6b4ea1"/>
<text x="555.0" y="137.9" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Router</text>
<rect x="700" y="110" width="150" height="46" rx="4" fill="#3b6ea5"/>
<text x="775.0" y="137.9" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Servidor</text>
<line x1="190" y1="133" x2="260" y2="133" stroke="#4a5560" stroke-width="3"/>
<line x1="410" y1="133" x2="480" y2="133" stroke="#4a5560" stroke-width="3"/>
<line x1="630" y1="133" x2="700" y2="133" stroke="#4a5560" stroke-width="3"/>
<rect x="40" y="190" width="590" height="46" rx="4" fill="#fdf1d8" stroke="#d68910" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="335" y="210" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Enlace 1 (LAN de la izquierda): una trama Ethernet</text>
<text x="335" y="227" text-anchor="middle" font-size="11" fill="#4a5560">MAC origen = PC A · MAC destino = interfaz del router (el switch no la cambia)</text>
<rect x="480" y="250" width="370" height="46" rx="4" fill="#ebe5f5" stroke="#6b4ea1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="665" y="270" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Enlace 2: el router fabrica una trama nueva</text>
<text x="665" y="287" text-anchor="middle" font-size="11" fill="#4a5560">MAC origen = router · MAC destino = servidor</text>
<rect x="40" y="64" width="810" height="30" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="445" y="84" text-anchor="middle" font-size="12" fill="#1a2332" font-weight="700">Paquete IP: IP origen = PC A · IP destino = servidor (no cambia en todo el camino)</text>
</svg>
