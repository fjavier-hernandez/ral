<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="900" height="470" fill="#f7f9fb"/>
<text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">La capa de enlace en el modelo OSI y sus dos subcapas</text>
<text x="450.0" y="50" text-anchor="middle" font-size="12" fill="#4a5560">Ethernet y Wi-Fi comparten la subcapa LLC; cambian la subcapa MAC y la capa física.</text>
<rect x="40" y="70" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="92.55" text-anchor="middle" font-size="13" fill="#1a2332">7 · Aplicación</text>
<rect x="40" y="114" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="136.55" text-anchor="middle" font-size="13" fill="#1a2332">6 · Presentación</text>
<rect x="40" y="158" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="180.55" text-anchor="middle" font-size="13" fill="#1a2332">5 · Sesión</text>
<rect x="40" y="202" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="224.55" text-anchor="middle" font-size="13" fill="#1a2332">4 · Transporte</text>
<rect x="40" y="246" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="268.55" text-anchor="middle" font-size="13" fill="#1a2332">3 · Red</text>
<rect x="40" y="290" width="210" height="92" rx="4" fill="#e3f1e8" stroke="#2f7d4a" stroke-width="1.5"/>
<text x="145" y="312" text-anchor="middle" font-size="13" fill="#1a2332" font-weight="700">2 · Enlace de datos</text>
<rect x="52" y="322" width="186" height="24" rx="4" fill="#2f7d4a"/>
<text x="145.0" y="338.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">LLC (control lógico)</text>
<rect x="52" y="350" width="186" height="24" rx="4" fill="#3b6ea5"/>
<text x="145.0" y="366.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">MAC (acceso al medio)</text>
<rect x="40" y="390" width="210" height="36" rx="4" fill="#e6e9ed" stroke="#4a5560" stroke-width="1.5"/>
<text x="145.0" y="412.55" text-anchor="middle" font-size="13" fill="#1a2332">1 · Física</text>
<text x="145" y="450" text-anchor="middle" font-size="12" fill="#4a5560" font-style="italic">PDU de la capa 2: trama</text>
<line x1="262" y1="334" x2="318" y2="334" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<line x1="262" y1="362" x2="318" y2="362" stroke="#4a5560" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="290" width="540" height="40" rx="4" fill="#2f7d4a"/>
<text x="590.0" y="314.55" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">IEEE 802.2 · LLC: interfaz única hacia la capa de red</text>
<rect x="320" y="336" width="104" height="46" rx="4" fill="#3b6ea5"/>
<text x="372.0" y="363.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">IEEE 802.3</text>
<rect x="320" y="390" width="104" height="46" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="372.0" y="409.35" text-anchor="middle" font-size="11" fill="#1a2332">Ethernet</text>
<text x="372.0" y="424.35" text-anchor="middle" font-size="11" fill="#1a2332">10 Mb/s</text>
<rect x="430" y="336" width="104" height="46" rx="4" fill="#3b6ea5"/>
<text x="482.0" y="363.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">IEEE 802.3u</text>
<rect x="430" y="390" width="104" height="46" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="482.0" y="409.35" text-anchor="middle" font-size="11" fill="#1a2332">Fast Ethernet</text>
<text x="482.0" y="424.35" text-anchor="middle" font-size="11" fill="#1a2332">100 Mb/s</text>
<rect x="540" y="336" width="104" height="46" rx="4" fill="#3b6ea5"/>
<text x="592.0" y="363.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">IEEE 802.3ab</text>
<rect x="540" y="390" width="104" height="46" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="592.0" y="409.35" text-anchor="middle" font-size="11" fill="#1a2332">Gigabit</text>
<text x="592.0" y="424.35" text-anchor="middle" font-size="11" fill="#1a2332">sobre cobre</text>
<rect x="650" y="336" width="104" height="46" rx="4" fill="#3b6ea5"/>
<text x="702.0" y="363.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">IEEE 802.3z</text>
<rect x="650" y="390" width="104" height="46" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="702.0" y="409.35" text-anchor="middle" font-size="11" fill="#1a2332">Gigabit</text>
<text x="702.0" y="424.35" text-anchor="middle" font-size="11" fill="#1a2332">sobre fibra</text>
<rect x="760" y="336" width="104" height="46" rx="4" fill="#3b6ea5"/>
<text x="812.0" y="363.2" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">IEEE 802.11</text>
<rect x="760" y="390" width="104" height="46" rx="4" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="812.0" y="409.35" text-anchor="middle" font-size="11" fill="#1a2332">Wi-Fi</text>
<text x="812.0" y="424.35" text-anchor="middle" font-size="11" fill="#1a2332">(CSMA/CA)</text>
<text x="590" y="280" text-anchor="middle" font-size="12" fill="#4a5560">Cada estándar fija su subcapa MAC y su capa física</text>
<text x="590" y="458" text-anchor="middle" font-size="11" fill="#4a5560" font-style="italic">Columnas de Ethernet (802.3) en azul; la de Wi-Fi (802.11) usa otro método de acceso</text>
</svg>
