<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#f7f9fb"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Ejercicio: cuenta dominios (sin colorear)</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#5a6570">Router – SW – 3 PC; y al mismo SW un hub con 2 PC (el puerto del SW al hub cuenta con el hub)</text>
  <rect x="310" y="280" width="100" height="36" rx="5" fill="#b7791f"/><text x="360" y="303" text-anchor="middle" fill="#fff" font-size="12">ROUTER</text>
  <rect x="310" y="160" width="100" height="36" rx="5" fill="#2f7d4a"/><text x="360" y="183" text-anchor="middle" fill="#fff" font-size="12">SW</text>
  <line x1="360" y1="196" x2="360" y2="280" stroke="#4a5560" stroke-width="2"/>
  <rect x="80" y="160" width="70" height="32" rx="4" fill="#4a5560"/><text x="115" y="181" text-anchor="middle" fill="#fff" font-size="11">HUB</text>
  <line x1="150" y1="176" x2="310" y2="176" stroke="#4a5560" stroke-width="2"/>
  <rect x="50" y="70" width="50" height="28" rx="3" fill="#3b6ea5"/><text x="75" y="88" text-anchor="middle" fill="#fff" font-size="10">PC1</text>
  <rect x="120" y="70" width="50" height="28" rx="3" fill="#3b6ea5"/><text x="145" y="88" text-anchor="middle" fill="#fff" font-size="10">PC2</text>
  <line x1="75" y1="98" x2="100" y2="160" stroke="#4a5560"/>
  <line x1="145" y1="98" x2="130" y2="160" stroke="#4a5560"/>
  <rect x="280" y="70" width="50" height="28" rx="3" fill="#3b6ea5"/><text x="305" y="88" text-anchor="middle" fill="#fff" font-size="10">PC3</text>
  <rect x="350" y="70" width="50" height="28" rx="3" fill="#3b6ea5"/><text x="375" y="88" text-anchor="middle" fill="#fff" font-size="10">PC4</text>
  <rect x="420" y="70" width="50" height="28" rx="3" fill="#3b6ea5"/><text x="445" y="88" text-anchor="middle" fill="#fff" font-size="10">PC5</text>
  <line x1="305" y1="98" x2="340" y2="160" stroke="#4a5560"/>
  <line x1="375" y1="98" x2="360" y2="160" stroke="#4a5560"/>
  <line x1="445" y1="98" x2="380" y2="160" stroke="#4a5560"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#1a2332">¿Cuántos dominios de colisión y de difusión hay?</text>
</svg>
