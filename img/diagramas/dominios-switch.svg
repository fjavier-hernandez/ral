<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="440" fill="#f7f9fb"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">4 PC + switch: 4 dominios de colisión · 1 de difusión</text>
  <!-- broadcast domain -->
  <ellipse cx="360" cy="200" rx="310" ry="155" fill="#6b4ea1" fill-opacity="0.12" stroke="#6b4ea1" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- switch -->
  <rect x="290" y="180" width="140" height="44" rx="6" fill="#2f7d4a" stroke="#1a2332"/>
  <text x="360" y="207" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">SWITCH</text>
  <!-- collision domains per link -->
  <ellipse cx="115" cy="130" rx="55" ry="70" fill="#f5a623" fill-opacity="0.25" stroke="#d68910"/>
  <ellipse cx="255" cy="130" rx="55" ry="70" fill="#f5a623" fill-opacity="0.25" stroke="#d68910"/>
  <ellipse cx="465" cy="130" rx="55" ry="70" fill="#f5a623" fill-opacity="0.25" stroke="#d68910"/>
  <ellipse cx="605" cy="130" rx="55" ry="70" fill="#f5a623" fill-opacity="0.25" stroke="#d68910"/>
  <rect x="80" y="70" width="70" height="40" rx="4" fill="#3b6ea5"/><text x="115" y="95" text-anchor="middle" fill="#fff" font-size="12">PC1</text>
  <line x1="115" y1="110" x2="320" y2="180" stroke="#4a5560" stroke-width="2"/>
  <rect x="220" y="70" width="70" height="40" rx="4" fill="#3b6ea5"/><text x="255" y="95" text-anchor="middle" fill="#fff" font-size="12">PC2</text>
  <line x1="255" y1="110" x2="340" y2="180" stroke="#4a5560" stroke-width="2"/>
  <rect x="430" y="70" width="70" height="40" rx="4" fill="#3b6ea5"/><text x="465" y="95" text-anchor="middle" fill="#fff" font-size="12">PC3</text>
  <line x1="465" y1="110" x2="380" y2="180" stroke="#4a5560" stroke-width="2"/>
  <rect x="570" y="70" width="70" height="40" rx="4" fill="#3b6ea5"/><text x="605" y="95" text-anchor="middle" fill="#fff" font-size="12">PC4</text>
  <line x1="605" y1="110" x2="400" y2="180" stroke="#4a5560" stroke-width="2"/>
  <rect x="40" y="350" width="640" height="70" rx="6" fill="#fff" stroke="#4a5560"/>
  <rect x="55" y="365" width="18" height="12" fill="#f5a623" fill-opacity="0.4" stroke="#d68910"/>
  <text x="80" y="375" font-size="12" fill="#1a2332">Naranja = dominio de colisión (un enlace PC–switch; full-dúplex → sin colisión real)</text>
  <rect x="55" y="390" width="18" height="12" fill="#6b4ea1" fill-opacity="0.25" stroke="#6b4ea1"/>
  <text x="80" y="400" font-size="12" fill="#1a2332">Violeta = 1 dominio de difusión (el switch reenvía broadcasts a todos los puertos)</text>
</svg>
