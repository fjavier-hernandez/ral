<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="420" fill="#f7f9fb"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">4 PC + hub: 1 dominio de colisión · 1 de difusión</text>
  <!-- collision+broadcast same zone -->
  <ellipse cx="360" cy="210" rx="300" ry="140" fill="#f5a623" fill-opacity="0.18" stroke="#d68910" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- hub -->
  <rect x="300" y="185" width="120" height="40" rx="6" fill="#4a5560" stroke="#1a2332"/>
  <text x="360" y="210" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">HUB</text>
  <!-- PCs -->
  <g>
    <rect x="80" y="70" width="70" height="45" rx="4" fill="#3b6ea5"/><text x="115" y="98" text-anchor="middle" fill="#fff" font-size="12">PC1</text>
    <line x1="115" y1="115" x2="320" y2="185" stroke="#4a5560" stroke-width="2"/>
    <rect x="220" y="70" width="70" height="45" rx="4" fill="#3b6ea5"/><text x="255" y="98" text-anchor="middle" fill="#fff" font-size="12">PC2</text>
    <line x1="255" y1="115" x2="340" y2="185" stroke="#4a5560" stroke-width="2"/>
    <rect x="430" y="70" width="70" height="45" rx="4" fill="#3b6ea5"/><text x="465" y="98" text-anchor="middle" fill="#fff" font-size="12">PC3</text>
    <line x1="465" y1="115" x2="380" y2="185" stroke="#4a5560" stroke-width="2"/>
    <rect x="570" y="70" width="70" height="45" rx="4" fill="#3b6ea5"/><text x="605" y="98" text-anchor="middle" fill="#fff" font-size="12">PC4</text>
    <line x1="605" y1="115" x2="400" y2="185" stroke="#4a5560" stroke-width="2"/>
  </g>
  <!-- legend -->
  <rect x="40" y="340" width="640" height="60" rx="6" fill="#fff" stroke="#4a5560"/>
  <rect x="60" y="358" width="22" height="14" fill="#f5a623" fill-opacity="0.35" stroke="#d68910"/>
  <text x="90" y="370" font-size="12" fill="#1a2332">Zona naranja = 1 dominio de colisión (todo el hub) y, a la vez, 1 dominio de difusión</text>
  <text x="90" y="388" font-size="11" fill="#5a6570">Half-dúplex: si dos PC transmiten a la vez, hay colisión (CSMA/CD).</text>
</svg>
