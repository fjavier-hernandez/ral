<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="520" fill="#f7f9fb"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2332">OSI (7 capas) frente a TCP/IP (4 capas)</text>
  <text x="180" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2332">Modelo OSI</text>
  <text x="620" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2332">Modelo TCP/IP</text>
  <!-- OSI rows -->
  <rect x="40" y="70" width="280" height="48" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/><text x="55" y="90" font-size="12" font-weight="600" fill="#1a2332">7 Aplicación</text><text x="55" y="106" font-size="10" fill="#5a6570">Datos · HTTP, DNS, DHCP</text>
  <rect x="40" y="122" width="280" height="40" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/><text x="55" y="147" font-size="12" fill="#1a2332">6 Presentación</text>
  <rect x="40" y="166" width="280" height="40" rx="4" fill="#e8f1fb" stroke="#3b6ea5"/><text x="55" y="191" font-size="12" fill="#1a2332">5 Sesión</text>
  <rect x="40" y="214" width="280" height="52" rx="4" fill="#eaf6ef" stroke="#2f7d4a"/><text x="55" y="236" font-size="12" font-weight="600" fill="#1a2332">4 Transporte</text><text x="55" y="252" font-size="10" fill="#5a6570">Segmento · TCP, UDP</text>
  <rect x="40" y="274" width="280" height="52" rx="4" fill="#fef6e8" stroke="#b7791f"/><text x="55" y="296" font-size="12" font-weight="600" fill="#1a2332">3 Red</text><text x="55" y="312" font-size="10" fill="#5a6570">Paquete · IP, ICMP</text>
  <rect x="40" y="334" width="280" height="52" rx="4" fill="#f3eef8" stroke="#6b4ea1"/><text x="55" y="356" font-size="12" font-weight="600" fill="#1a2332">2 Enlace de datos</text><text x="55" y="372" font-size="10" fill="#5a6570">Trama · Ethernet, Wi-Fi</text>
  <rect x="40" y="394" width="280" height="48" rx="4" fill="#eef0f2" stroke="#4a5560"/><text x="55" y="414" font-size="12" font-weight="600" fill="#1a2332">1 Física</text><text x="55" y="430" font-size="10" fill="#5a6570">Bits · cable, radio, SFP</text>
  <!-- TCP/IP bands -->
  <rect x="480" y="70" width="280" height="136" rx="6" fill="#e8f1fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="620" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Aplicación</text>
  <text x="620" y="142" text-anchor="middle" font-size="11" fill="#5a6570">Datos · HTTP, DNS, DHCP…</text>
  <text x="620" y="162" text-anchor="middle" font-size="10" fill="#5a6570">(OSI 5 + 6 + 7)</text>
  <rect x="480" y="214" width="280" height="52" rx="6" fill="#eaf6ef" stroke="#2f7d4a" stroke-width="2"/>
  <text x="620" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Transporte</text>
  <text x="620" y="254" text-anchor="middle" font-size="11" fill="#5a6570">Segmento · TCP, UDP</text>
  <rect x="480" y="274" width="280" height="52" rx="6" fill="#fef6e8" stroke="#b7791f" stroke-width="2"/>
  <text x="620" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Internet</text>
  <text x="620" y="314" text-anchor="middle" font-size="11" fill="#5a6570">Paquete · IP, ICMP</text>
  <rect x="480" y="334" width="280" height="108" rx="6" fill="#eef0f2" stroke="#4a5560" stroke-width="2"/>
  <text x="620" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">Acceso a la red</text>
  <text x="620" y="397" text-anchor="middle" font-size="11" fill="#5a6570">Trama + bits · Ethernet, Wi-Fi</text>
  <text x="620" y="417" text-anchor="middle" font-size="10" fill="#5a6570">(OSI 1 + 2)</text>
  <!-- braces / arrows -->
  <path d="M330 138 C360 138, 360 138, 470 138" stroke="#3b6ea5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M330 240 C360 240, 360 240, 470 240" stroke="#2f7d4a" stroke-width="1.5" fill="none"/>
  <path d="M330 300 C360 300, 360 300, 470 300" stroke="#b7791f" stroke-width="1.5" fill="none"/>
  <path d="M330 390 C360 390, 360 390, 470 390" stroke="#4a5560" stroke-width="1.5" fill="none"/>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b6ea5"/></marker></defs>
  <text x="440" y="500" text-anchor="middle" font-size="11" fill="#5a6570">OSI = modelo de referencia · TCP/IP = pila real de Internet · Cada capa tiene su PDU</text>
</svg>
